<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Evades 3 — Смена пароля</title>
  <meta name="theme-color" content="#0a2516" />
  <link rel="icon" href="logo.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;600;700&family=Exo+2:wght@300;600;800;900&display=swap"
    rel="stylesheet"
  />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Exo 2', 'Orbitron', system-ui, -apple-system, Segoe UI, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      background:
        radial-gradient(ellipse 70% 60% at 18% 12%, rgba(124, 58, 237, 0.55) 0%, transparent 60%),
        radial-gradient(ellipse 75% 55% at 82% 8%, rgba(56, 189, 248, 0.45) 0%, transparent 60%),
        radial-gradient(ellipse 65% 65% at 88% 88%, rgba(16, 185, 129, 0.55) 0%, transparent 60%),
        radial-gradient(ellipse 60% 55% at 12% 85%, rgba(244, 114, 182, 0.40) 0%, transparent 60%),
        radial-gradient(ellipse 80% 60% at 50% 50%, rgba(255, 215, 0, 0.18) 0%, transparent 70%),
        linear-gradient(135deg, #05080f 0%, #0a1226 22%, #11214a 50%, #0a1226 78%, #05080f 100%);
      background-attachment: fixed;
      background-size: 220% 220%, 220% 220%, 220% 220%, 220% 220%, 240% 240%, 400% 400%;
      animation: gradientShift 24s ease infinite;
      overflow-x: hidden;
      min-height: 100vh;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background:
        radial-gradient(ellipse 95% 95% at 50% 50%, transparent 55%, rgba(0,0,0,0.45) 100%),
        radial-gradient(circle at 22% 26%, rgba(180,220,255,0.07) 0%, transparent 45%),
        radial-gradient(circle at 78% 74%, rgba(255,200,160,0.05) 0%, transparent 45%);
      pointer-events: none;
      z-index: 1;
    }

    @keyframes gradientShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Логотип */
    .logo-image {
      position: fixed;
      top: 15px;
      left: 15px;
      width: 110px;
      height: 110px;
      object-fit: contain;
      z-index: 1000;
      filter: drop-shadow(0 8px 20px rgba(0,0,0,0.35));
    }

    /* ===== КАРТОЧКА ===== */
    .page-wrap {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 480px;
      padding: 24px 16px;
    }

    .glass-card {
      background: linear-gradient(145deg, rgba(255,255,255,0.10), rgba(255,255,255,0.04));
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border-radius: 28px;
      border: 1px solid rgba(255,255,255,0.16);
      padding: 48px 44px 44px;
      box-shadow:
        0 24px 60px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.22);
      position: relative;
      overflow: hidden;
      animation: cardIn 0.55s cubic-bezier(.18,1.2,.22,1) both;
    }

    @keyframes cardIn {
      0% { opacity: 0; transform: translateY(30px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Блеск */
    .glass-card::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
      animation: shine 4s infinite;
      pointer-events: none;
    }

    @keyframes shine {
      0% { left: -100%; }
      50%, 100% { left: 100%; }
    }

    /* Заголовок */
    .card-icon {
      font-size: 48px;
      text-align: center;
      margin-bottom: 6px;
      filter: drop-shadow(0 0 18px rgba(255,215,0,0.6));
      animation: iconFloat 3s ease-in-out infinite;
    }

    @keyframes iconFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .card-title {
      font-family: 'Exo 2', sans-serif;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 6px;
      color: #FFD84D;
      text-shadow:
        0 1px 0 #B8860B,
        0 2px 0 #9A7209,
        0 0 20px rgba(255,215,0,0.7),
        0 0 40px rgba(255,140,0,0.4);
      -webkit-text-stroke: 1.5px #000;
    }

    .card-sub {
      text-align: center;
      color: rgba(255,255,255,0.55);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 36px;
    }

    /* Разделитель */
    .card-divider {
      width: 60%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,215,0,0.55), transparent);
      margin: 0 auto 36px;
      border: none;
    }

    /* Поля */
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 28px;
    }

    .field-label {
      display: block;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.6);
      margin-bottom: 7px;
    }

    .field-wrap {
      position: relative;
    }

    .field-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
      pointer-events: none;
      opacity: 0.6;
      transition: opacity 0.2s;
    }

    .field-input {
      width: 100%;
      padding: 15px 48px 15px 48px;
      background: rgba(255,255,255,0.07);
      border: 1.5px solid rgba(255,255,255,0.18);
      border-radius: 14px;
      color: #fff;
      font-family: 'Exo 2', sans-serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
      outline: none;
      transition: border-color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
      backdrop-filter: blur(8px);
    }

    .field-input::placeholder {
      color: rgba(255,255,255,0.28);
      font-weight: 400;
    }

    .field-input:focus {
      border-color: rgba(255,215,0,0.7);
      background: rgba(255,255,255,0.11);
      box-shadow:
        0 0 0 3px rgba(255,215,0,0.12),
        0 4px 20px rgba(0,0,0,0.25);
    }

    .field-input:focus + .field-icon,
    .field-wrap:focus-within .field-icon {
      opacity: 1;
    }

    /* Кнопка показать/скрыть пароль */
    .eye-btn {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: rgba(255,255,255,0.4);
      font-size: 18px;
      cursor: pointer;
      padding: 4px;
      transition: color 0.2s;
      line-height: 1;
    }
    .eye-btn:hover { color: rgba(255,215,0,0.85); }

    /* Подсказка силы пароля */
    .strength-bar-wrap {
      margin-top: 8px;
      display: none;
    }
    .strength-bar-wrap.visible { display: block; }

    .strength-track {
      height: 4px;
      border-radius: 999px;
      background: rgba(255,255,255,0.1);
      overflow: hidden;
    }

    .strength-fill {
      height: 100%;
      border-radius: 999px;
      width: 0%;
      transition: width 0.4s ease, background 0.4s ease;
    }

    .strength-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: 4px;
      color: rgba(255,255,255,0.45);
      transition: color 0.3s;
    }

    /* Кнопка сохранить */
    .btn-save {
      position: relative;
      width: 100%;
      padding: 18px 24px;
      font-family: 'Exo 2', sans-serif;
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #fff;
      background: linear-gradient(180deg, #7c3aed 0%, #5b21b6 50%, #4c1d95 100%);
      border: 0;
      border-radius: 14px;
      cursor: pointer;
      overflow: hidden;
      box-shadow:
        0 10px 0 #2d1263,
        0 14px 30px rgba(91,33,182,0.5),
        inset 0 2px 0 rgba(255,255,255,0.35),
        inset 0 -8px 14px rgba(0,0,0,0.35);
      text-shadow: 0 2px 6px rgba(0,0,0,0.5);
      transition: filter 0.2s, transform 0.1s, box-shadow 0.1s;
      margin-bottom: 14px;
    }

    .btn-save::before {
      content: '';
      position: absolute;
      left: 10%; right: 10%;
      top: 8px;
      height: 38%;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255,255,255,0.55), rgba(255,255,255,0));
      pointer-events: none;
    }

    .btn-save:hover:not(:disabled) {
      filter: brightness(1.12);
      box-shadow:
        0 10px 0 #2d1263,
        0 18px 40px rgba(91,33,182,0.65),
        inset 0 2px 0 rgba(255,255,255,0.45),
        inset 0 -10px 18px rgba(0,0,0,0.4);
    }

    .btn-save:active:not(:disabled) {
      transform: translateY(6px);
      box-shadow:
        0 4px 0 #2d1263,
        0 8px 18px rgba(91,33,182,0.4),
        inset 0 2px 0 rgba(255,255,255,0.25),
        inset 0 -4px 8px rgba(0,0,0,0.3);
    }

    .btn-save:disabled {
      cursor: not-allowed;
      filter: saturate(0.4) brightness(0.7);
    }

    /* Кнопка вернуться на главную */
    .btn-home {
      display: none;
      width: 100%;
      padding: 15px 24px;
      font-family: 'Exo 2', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.85);
      background: linear-gradient(145deg, rgba(255,255,255,0.12), rgba(255,255,255,0.05));
      border: 1.5px solid rgba(255,255,255,0.25);
      border-radius: 14px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      box-shadow:
        0 8px 20px rgba(0,0,0,0.25),
        inset 0 1px 0 rgba(255,255,255,0.2);
      transition: background 0.25s, border-color 0.25s, transform 0.2s, box-shadow 0.2s;
      text-decoration: none;
      text-align: center;
    }

    .btn-home:hover {
      background: linear-gradient(145deg, rgba(255,255,255,0.2), rgba(255,255,255,0.1));
      border-color: rgba(255,215,0,0.55);
      color: #FFD84D;
      transform: translateY(-2px);
      box-shadow:
        0 12px 28px rgba(0,0,0,0.35),
        0 0 16px rgba(255,215,0,0.15),
        inset 0 1px 0 rgba(255,255,255,0.3);
    }

    .btn-home.visible { display: block; animation: fadeUp 0.4s ease both; }

    /* ===== СООБЩЕНИЯ ===== */
    .status-msg {
      display: none;
      border-radius: 14px;
      padding: 16px 20px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
      line-height: 1.5;
      margin-bottom: 18px;
      text-align: center;
      animation: fadeUp 0.35s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .status-msg.success {
      display: block;
      background: linear-gradient(135deg, rgba(52,211,153,0.18), rgba(16,185,129,0.08));
      border: 1.5px solid rgba(52,211,153,0.5);
      color: #6ee7b7;
      text-shadow: 0 0 12px rgba(52,211,153,0.4);
      box-shadow:
        0 0 0 4px rgba(52,211,153,0.08),
        0 8px 24px rgba(0,0,0,0.3);
    }

    .status-msg.error {
      display: block;
      background: linear-gradient(135deg, rgba(239,68,68,0.18), rgba(185,28,28,0.08));
      border: 1.5px solid rgba(239,68,68,0.5);
      color: #fca5a5;
      text-shadow: 0 0 12px rgba(239,68,68,0.4);
      box-shadow:
        0 0 0 4px rgba(239,68,68,0.08),
        0 8px 24px rgba(0,0,0,0.3);
    }

    /* Блокировка формы после успеха */
    .form-locked .field-input { pointer-events: none; opacity: 0.5; }
    .form-locked .btn-save { display: none; }

    /* Частицы успеха */
    @keyframes confettiFly {
      0%   { transform: translate(0,0) scale(1) rotate(0deg); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(0) rotate(var(--rot)); opacity: 0; }
    }

    .confetti-dot {
      position: fixed;
      width: 8px; height: 8px;
      border-radius: 2px;
      pointer-events: none;
      z-index: 9999;
      animation: confettiFly 0.9s ease-out forwards;
    }

    /* Shake при ошибке */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      18%  { transform: translateX(-8px); }
      36%  { transform: translateX(8px); }
      54%  { transform: translateX(-5px); }
      72%  { transform: translateX(5px); }
      88%  { transform: translateX(-2px); }
    }

    .shake { animation: shake 0.45s ease; }

    /* Спиннер */
    .spinner {
      display: inline-block;
      width: 18px; height: 18px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Responsive */
    @media (max-width: 520px) {
      .glass-card { padding: 36px 24px 32px; }
      .card-title { font-size: 20px; }
    }
  </style>
</head>
<body>

  <!-- Логотип -->
  <a href="/">
    <img src="logo.png" alt="Evades 3" class="logo-image" onerror="this.style.display='none'" />
  </a>

  <div class="page-wrap">
    <div class="glass-card" id="card">

      <div class="card-icon">🔐</div>
      <div class="card-title">Смена пароля</div>
      <div class="card-sub">Evades 3 · Безопасность аккаунта</div>
      <hr class="card-divider" />

      <!-- Статус -->
      <div class="status-msg" id="statusMsg"></div>

      <!-- Поля -->
      <div class="field-group" id="fieldGroup">

        <div>
          <label class="field-label" for="newPass">Новый пароль</label>
          <div class="field-wrap">
            <span class="field-icon">🔑</span>
            <input
              class="field-input"
              type="password"
              id="newPass"
              placeholder="Минимум 8 символов"
              autocomplete="new-password"
              maxlength="128"
            />
            <button type="button" class="eye-btn" id="eyeNew" aria-label="Показать пароль">👁</button>
          </div>
          <!-- Индикатор силы -->
          <div class="strength-bar-wrap" id="strengthWrap">
            <div class="strength-track">
              <div class="strength-fill" id="strengthFill"></div>
            </div>
            <div class="strength-label" id="strengthLabel">—</div>
          </div>
        </div>

        <div>
          <label class="field-label" for="confirmPass">Повторите новый пароль</label>
          <div class="field-wrap">
            <span class="field-icon">🔒</span>
            <input
              class="field-input"
              type="password"
              id="confirmPass"
              placeholder="Повторите пароль"
              autocomplete="new-password"
              maxlength="128"
            />
            <button type="button" class="eye-btn" id="eyeConfirm" aria-label="Показать пароль">👁</button>
          </div>
        </div>

      </div>

      <!-- Кнопка сохранить -->
      <button class="btn-save" id="btnSave" type="button">
        💾 &nbsp;Сохранить пароль
      </button>

      <!-- Кнопка на главную (появляется после успеха) -->
      <a href="https://evades3.com" class="btn-home" id="btnHome">
        🏠 &nbsp;Вернуться на главную
      </a>

    </div>
  </div>

  <script>
    const newPassEl     = document.getElementById('newPass');
    const confirmPassEl = document.getElementById('confirmPass');
    const btnSave       = document.getElementById('btnSave');
    const btnHome       = document.getElementById('btnHome');
    const statusMsg     = document.getElementById('statusMsg');
    const eyeNew        = document.getElementById('eyeNew');
    const eyeConfirm    = document.getElementById('eyeConfirm');
    const strengthWrap  = document.getElementById('strengthWrap');
    const strengthFill  = document.getElementById('strengthFill');
    const strengthLabel = document.getElementById('strengthLabel');
    const card          = document.getElementById('card');
    const fieldGroup    = document.getElementById('fieldGroup');

    // ===== Глазик =====
    function toggleEye(input, btn) {
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.textContent = show ? '🙈' : '👁';
    }
    eyeNew.addEventListener('click',     () => toggleEye(newPassEl, eyeNew));
    eyeConfirm.addEventListener('click', () => toggleEye(confirmPassEl, eyeConfirm));

    // ===== Сила пароля =====
    function getStrength(p) {
      if (!p) return { score: 0, label: '—', color: 'transparent' };
      let s = 0;
      if (p.length >= 8)  s++;
      if (p.length >= 12) s++;
      if (/[A-Z]/.test(p)) s++;
      if (/[0-9]/.test(p)) s++;
      if (/[^A-Za-z0-9]/.test(p)) s++;
      const map = [
        { label: 'Очень слабый', color: '#ef4444' },
        { label: 'Слабый',       color: '#f97316' },
        { label: 'Средний',      color: '#eab308' },
        { label: 'Хороший',      color: '#22c55e' },
        { label: 'Отличный',     color: '#10b981' },
        { label: 'Надёжный 🏆',  color: '#FFD84D' },
      ];
      const idx = Math.min(s, 5);
      return { score: (idx / 5) * 100, ...map[idx] };
    }

    newPassEl.addEventListener('input', () => {
      const v = newPassEl.value;
      if (v.length > 0) {
        strengthWrap.classList.add('visible');
        const st = getStrength(v);
        strengthFill.style.width  = st.score + '%';
        strengthFill.style.background = st.color;
        strengthLabel.textContent = st.label;
        strengthLabel.style.color = st.color;
      } else {
        strengthWrap.classList.remove('visible');
      }
    });

    // ===== Валидация =====
    function validate() {
      const p1 = newPassEl.value.trim();
      const p2 = confirmPassEl.value.trim();
      if (!p1) return { ok: false, msg: '❌ Введите новый пароль.' };
      if (p1.length < 8) return { ok: false, msg: '❌ Пароль должен содержать минимум 8 символов.' };
      if (!p2) return { ok: false, msg: '❌ Повторите новый пароль.' };
      if (p1 !== p2) return { ok: false, msg: '❌ Пароли не совпадают. Проверьте введённые данные.' };
      return { ok: true };
    }

    // ===== Шоу статуса =====
    function showStatus(text, type) {
      statusMsg.textContent = text;
      statusMsg.className   = 'status-msg ' + type;
      statusMsg.style.display = 'block';
      // Restart animation
      statusMsg.style.animation = 'none';
      requestAnimationFrame(() => {
        statusMsg.style.animation = '';
      });
    }

    // ===== Конфетти =====
    function spawnConfetti(x, y) {
      const colors = ['#FFD84D','#7c3aed','#22c55e','#38bdf8','#f97316','#f472b6'];
      for (let i = 0; i < 28; i++) {
        const dot = document.createElement('div');
        dot.className = 'confetti-dot';
        const angle = (Math.PI * 2 / 28) * i + Math.random() * 0.5;
        const dist  = 60 + Math.random() * 120;
        dot.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
        dot.style.setProperty('--ty', Math.sin(angle) * dist - 40 + 'px');
        dot.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
        dot.style.left = (x - 4) + 'px';
        dot.style.top  = (y - 4) + 'px';
        dot.style.background = colors[Math.floor(Math.random() * colors.length)];
        dot.style.animationDelay = (Math.random() * 0.15) + 's';
        document.body.appendChild(dot);
        setTimeout(() => dot.remove(), 1200);
      }
    }

    // ===== Встряска =====
    function shakeCard() {
      card.classList.remove('shake');
      void card.offsetWidth;
      card.classList.add('shake');
      card.addEventListener('animationend', () => card.classList.remove('shake'), { once: true });
    }

    // ===== Кнопка СОХРАНИТЬ =====
    btnSave.addEventListener('click', async (e) => {
      statusMsg.className = 'status-msg';
      statusMsg.style.display = 'none';

      const { ok, msg } = validate();
      if (!ok) {
        showStatus(msg, 'error');
        shakeCard();
        return;
      }

      // Симуляция запроса к серверу
      btnSave.disabled = true;
      btnSave.innerHTML = '<span class="spinner"></span>Сохраняем...';

      await new Promise(r => setTimeout(r, 1400));

      // ----- Симулируем успех -----
      // Чтобы показать ошибку замените на: simulateError = true
      const simulateError = false;

      if (simulateError) {
        btnSave.disabled = false;
        btnSave.innerHTML = '💾 &nbsp;Сохранить пароль';
        showStatus('❌ Ошибка сервера. Попробуйте позже.', 'error');
        shakeCard();
        return;
      }

      // Успех
      showStatus('✅ Пароль успешно изменён! Теперь используйте новый пароль для входа.', 'success');
      fieldGroup.classList.add('form-locked');

      // Конфетти из центра кнопки
      const r = btnSave.getBoundingClientRect();
      spawnConfetti(r.left + r.width / 2, r.top + r.height / 2);

      btnSave.style.display = 'none';
      btnHome.classList.add('visible');
    });

    // Enter → сохранить
    [newPassEl, confirmPassEl].forEach(el => {
      el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') btnSave.click();
      });
    });
  </script>
</body>
</html>
